<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>TubeGrabber</title>
        <style>
            :root {
                --bg: #f5f5f7;
                --card: #ffffff;
                --text: #1d1d1f;
                --muted: #6e6e73;
                --line: #e3e3e8;
                --field: #f2f2f5;
                --accent: #e5484d;
                --accent-text: #ffffff;
                --ok: #2e9e5b;
                --track: #ececf0;
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111113;
                    --card: #1c1c1f;
                    --text: #f2f2f4;
                    --muted: #9b9ba3;
                    --line: #2c2c31;
                    --field: #26262b;
                    --accent: #ff5f63;
                    --ok: #4cc38a;
                    --track: #2c2c31;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            }
            main {
                max-width: 760px;
                margin: 0 auto;
                padding: 32px 16px 64px;
            }
            h1 {
                font-size: 22px;
                margin: 0 0 4px;
                letter-spacing: -0.01em;
            }
            h1 span {
                color: var(--accent);
            }
            .sub {
                color: var(--muted);
                margin: 0 0 20px;
            }
            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 18px;
            }
            textarea,
            input[type="text"],
            select {
                font: inherit;
                color: inherit;
                background: var(--field);
                border: 1px solid transparent;
                border-radius: 9px;
                padding: 9px 11px;
                outline: none;
            }
            textarea:focus,
            input:focus,
            select:focus {
                border-color: var(--accent);
            }
            textarea {
                width: 100%;
                min-height: 92px;
                resize: vertical;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
                margin-top: 14px;
            }
            .grow {
                flex: 1;
                min-width: 200px;
            }
            label {
                color: var(--muted);
            }
            .seg {
                display: inline-flex;
                background: var(--field);
                border-radius: 9px;
                padding: 3px;
            }
            .seg input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .seg label {
                padding: 6px 16px;
                border-radius: 7px;
                cursor: pointer;
                color: var(--text);
                font-weight: 500;
            }
            .seg input:checked + label {
                background: var(--card);
                box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
            }
            .seg input:focus-visible + label {
                outline: 2px solid var(--accent);
            }
            button {
                font: inherit;
                font-weight: 500;
                border: 0;
                border-radius: 9px;
                padding: 9px 14px;
                cursor: pointer;
                background: var(--field);
                color: var(--text);
            }
            button:hover {
                filter: brightness(0.95);
            }
            button.primary {
                background: var(--accent);
                color: var(--accent-text);
                padding: 10px 22px;
            }
            button.link {
                background: none;
                padding: 4px 6px;
                color: var(--accent);
            }
            /* show only the options for the selected format */
            #form[data-format="mp3"] .mp4-only,
            #form[data-format="mp4"] .mp3-only {
                display: none;
            }
            details {
                margin-top: 14px;
                color: var(--muted);
            }
            summary {
                cursor: pointer;
            }
            .hint {
                color: var(--muted);
                font-size: 12px;
            }
            .msg {
                color: var(--accent);
                min-height: 1em;
            }
            .queue-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 28px 0 10px;
            }
            .queue-head h2 {
                font-size: 15px;
                margin: 0;
            }
            #jobs {
                display: grid;
                gap: 10px;
            }
            .job {
                padding: 14px 16px;
            }
            .job-top {
                display: flex;
                gap: 10px;
                align-items: baseline;
            }
            .job-title {
                flex: 1;
                font-weight: 600;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .tag {
                font-size: 11px;
                font-weight: 600;
                color: var(--muted);
                background: var(--field);
                border-radius: 6px;
                padding: 2px 7px;
                white-space: nowrap;
            }
            .item {
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                margin-top: 2px;
            }
            .bar {
                height: 6px;
                background: var(--track);
                border-radius: 99px;
                overflow: hidden;
                margin: 10px 0 8px;
            }
            .bar > div {
                height: 100%;
                background: var(--accent);
                border-radius: 99px;
                transition: width 0.4s;
            }
            .bar.done > div {
                background: var(--ok);
            }
            .bar.cancelled > div {
                background: var(--muted);
            }
            .bar.busy > div {
                width: 35% !important;
                animation: slide 1.1s ease-in-out infinite;
            }
            @keyframes slide {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(290%);
                }
            }
            .job-bottom {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .status {
                flex: 1;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .status.error {
                color: var(--accent);
                white-space: normal;
            }
            .status.ok {
                color: var(--ok);
            }
            .empty {
                text-align: center;
                color: var(--muted);
                padding: 28px;
            }
            .songs {
                --row: 44px;
                margin-top: 10px;
            }
            .songs summary {
                color: var(--muted);
                cursor: pointer;
            }
            .song-list {
                max-height: calc(var(--row) * 6 + 2px); /* 6 songs visible, the rest scroll */
                overflow-y: auto;
                margin-top: 8px;
                border: 1px solid var(--line);
                border-radius: 10px;
            }
            .song {
                height: var(--row);
                padding: 6px 12px;
                border-bottom: 1px solid var(--line);
                display: grid;
                grid-template-columns: 28px 1fr auto;
                gap: 4px 8px;
                align-items: center;
            }
            .song:last-child {
                border-bottom: 0;
            }
            .song .num,
            .song .st {
                color: var(--muted);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .song .name {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .song.done .st {
                color: var(--ok);
            }
            .song.error .st {
                color: var(--accent);
            }
            .song .bar {
                grid-column: 2 / 4;
                height: 3px;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Tube<span>Grabber</span></h1>
            <p class="sub">Paste YouTube links (videos or playlists). Downloads run one after another.</p>

            <form class="card" id="form">
                <textarea
                    id="links"
                    placeholder="https://www.youtube.com/watch?v=…&#10;https://music.youtube.com/playlist?list=…"
                    aria-label="YouTube links, one per line"
                    autofocus
                ></textarea>
                <div class="hint">One link per line. ⌘↵ to start.</div>

                <div class="row">
                    <div class="seg" role="radiogroup" aria-label="Format">
                        <input type="radio" name="format" id="f-mp3" value="mp3" checked /><label for="f-mp3">MP3 audio</label>
                        <input type="radio" name="format" id="f-mp4" value="mp4" /><label for="f-mp4">MP4 video</label>
                    </div>
                </div>

                <div class="row mp3-only">
                    <label for="bitrate">Bitrate</label>
                    <select id="bitrate">
                        <option value="best">Best (VBR)</option>
                        <option value="192">192 kbps</option>
                        <option value="128">128 kbps</option>
                    </select>
                </div>
                <div class="row mp4-only">
                    <label for="quality">Quality</label>
                    <select id="quality">
                        <option value="best">Best</option>
                        <option value="4k">4K</option>
                        <option value="2k">2K</option>
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                    </select>
                    <label style="margin-left: auto"><input type="checkbox" id="aria" /> Use aria2c downloader</label>
                </div>

                <div class="row">
                    <input type="text" id="folder" class="grow" aria-label="Download folder" value="~/Downloads/YouTube" />
                    <button type="button" id="browse">Choose…</button>
                </div>

                <div class="row">
                    <label><input type="checkbox" id="numbering" checked /> Number playlist items (01. Title)</label>
                </div>

                <div class="row">
                    <button class="primary" type="submit">Download</button>
                    <span class="msg" id="msg" role="status"></span>
                </div>
            </form>

            <div class="queue-head">
                <h2>Queue</h2>
                <button class="link" id="clear" type="button">Clear finished</button>
            </div>
            <div id="jobs"></div>
        </main>

        <script>
            const $ = (s) => document.querySelector(s);
            const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

            async function api(path, body) {
                const res = await fetch(path, {
                    method: body ? "POST" : "GET",
                    headers: { "Content-Type": "application/json" },
                    body: body && JSON.stringify(body),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || res.statusText);
                return data;
            }

            // Settings: remembered per browser, best effort
            function settings() {
                return {
                    format: $("input[name=format]:checked").value,
                    quality: $("#quality").value,
                    bitrate: $("#bitrate").value,
                    folder: $("#folder").value.trim(),
                    numbering: $("#numbering").checked,
                    aria: $("#aria").checked,
                };
            }
            function applyState() {
                const s = settings();
                $("#form").dataset.format = s.format;
                try {
                    localStorage.setItem("tubegrabber", JSON.stringify(s));
                } catch {}
            }
            try {
                const s = JSON.parse(localStorage.getItem("tubegrabber"));
                if (s) {
                    $(`#f-${s.format}`) && ($(`#f-${s.format}`).checked = true);
                    $("#quality").value = s.quality;
                    if ($(`#bitrate option[value="${s.bitrate}"]`)) $("#bitrate").value = s.bitrate;
                    $("#folder").value = s.folder || $("#folder").value;
                    $("#numbering").checked = s.numbering;
                    $("#aria").checked = s.aria;
                }
            } catch {}
            applyState();
            $("#form").addEventListener("change", applyState);

            const say = (text) => ($("#msg").textContent = text);

            $("#form").addEventListener("submit", async (e) => {
                e.preventDefault();
                try {
                    const { added } = await api("/api/jobs", { links: $("#links").value, ...settings() });
                    $("#links").value = "";
                    say(`Added ${added} to the queue`);
                    setTimeout(() => say(""), 2500);
                    refresh();
                } catch (err) {
                    say(err.message);
                }
            });
            $("#links").addEventListener("keydown", (e) => {
                if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#form").requestSubmit();
            });
            $("#browse").addEventListener("click", async () => {
                const { folder } = await api("/api/browse", {});
                if (folder) {
                    $("#folder").value = folder;
                    applyState();
                }
            });
            $("#clear").addEventListener("click", () => api("/api/clear", {}).then(refresh));
            const openSongs = new Set(); // job ids whose song list is unfolded, kept across re-renders
            $("#jobs").addEventListener("click", (e) => {
                const b = e.target.closest("button[data-action]");
                if (b) api(`/api/jobs/${b.dataset.id}/${b.dataset.action}`, {}).then(refresh);
                const s = e.target.closest(".songs > summary");
                if (s) {
                    const d = s.parentElement; // click fires before the toggle, so d.open is the old state
                    d.open ? openSongs.delete(d.dataset.id) : openSongs.add(d.dataset.id);
                }
            });

            // Rendering
            const mb = (bytes) => (bytes / 1048576).toFixed(1);
            const time = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

            function statusText(j) {
                const saved = j.completed > 1 ? `${j.completed} saved` : "";
                if (j.status === "queued") return ["Waiting…", ""];
                if (j.status === "cancelled") return ["Cancelled", ""];
                if (j.status === "done") return [j.completed > 1 ? `Done · ${j.completed} files` : "Done", "ok"];
                if (j.status === "error") {
                    const n = j.errors.length;
                    const head = j.completed ? `${j.completed} saved, ${n} failed` : "Failed";
                    return [`${head}: ${j.errors[n - 1] || "yt-dlp exited with an error"}`, "error"];
                }
                if (j.stage === "processing") return ["Converting…", ""];
                if (j.percent == null) return ["Starting…", ""];
                const parts = [`${j.percent.toFixed(0)}%`];
                if (j.speed) parts.push(`${mb(j.speed)} MB/s`);
                if (j.eta != null) parts.push(`${time(j.eta)} left`);
                if (saved) parts.push(saved);
                return [parts.join(" · "), ""];
            }

            function songHtml(s) {
                const text = { done: "Done", processing: "Converting…", error: "Failed", cancelled: "Cancelled" }[s.status] ?? (s.percent == null ? "Starting…" : `${s.percent.toFixed(0)}%`);
                const bar = s.status === "done" ? "done" : ["error", "cancelled"].includes(s.status) ? "cancelled" : s.status === "processing" || s.percent == null ? "busy" : "";
                const width = s.status === "done" ? 100 : s.percent || 0;
                return `<div class="song ${s.status ?? ""}">
                    <span class="num">${s.index ?? ""}</span><span class="name" title="${esc(s.title)}">${esc(s.title)}</span><span class="st">${text}</span>
                    <div class="bar ${bar}"><div style="width:${width}%"></div></div>
                </div>`;
            }

            function jobHtml(j) {
                const title = j.playlist || j.title || j.url;
                const tag = j.format === "mp3" ? `MP3 · ${j.bitrate === "best" ? "Best" : `${j.bitrate}k`}` : `MP4 · ${j.quality === "best" ? "Best" : j.quality}`;
                const [text, cls] = statusText(j);
                const running = j.status === "running";
                const busy = running && (j.percent == null || j.stage === "processing");
                const width = j.status === "done" ? 100 : j.percent || 0;
                const item = j.playlist && j.title ? `${j.index ?? "?"}${j.count ? ` of ${j.count}` : ""} · ${j.title}` : "";
                const btn = (action, label) => `<button class="link" data-action="${action}" data-id="${j.id}">${label}</button>`;
                const buttons = [
                    ["queued", "running"].includes(j.status) && btn("cancel", "Cancel"),
                    ["error", "cancelled"].includes(j.status) && btn("retry", "Retry"),
                    (j.file || j.status === "done") && btn("reveal", "Show in Finder"),
                ].filter(Boolean);
                const songs =
                    j.playlist && j.items.length
                        ? `<details class="songs" data-id="${j.id}" ${openSongs.has(String(j.id)) ? "open" : ""}>
                            <summary>${j.format === "mp3" ? "Songs" : "Videos"} · ${j.completed} of ${j.count ?? j.items.length} done</summary>
                            <div class="song-list" data-id="${j.id}">${j.items.map(songHtml).join("")}</div>
                        </details>`
                        : "";
                return `<div class="card job">
                    <div class="job-top"><div class="job-title" title="${esc(j.url)}">${esc(title)}</div><span class="tag">${tag}</span></div>
                    ${item ? `<div class="item">${esc(item)}</div>` : ""}
                    <div class="bar ${["done", "cancelled"].includes(j.status) ? j.status : ""} ${busy ? "busy" : ""}"><div style="width:${width}%"></div></div>
                    <div class="job-bottom"><div class="status ${cls}">${esc(text)}</div>${buttons.join("")}</div>
                    ${songs}
                </div>`;
            }

            async function refresh() {
                try {
                    const jobs = await api("/api/jobs");
                    // Re-rendering resets each song list's scroll: restore it, or stay pinned to the bottom (current song)
                    const scroll = {};
                    document.querySelectorAll(".song-list").forEach((l) => {
                        scroll[l.dataset.id] = l.scrollTop + l.clientHeight >= l.scrollHeight - 4 ? null : l.scrollTop;
                    });
                    $("#jobs").innerHTML = jobs.length
                        ? jobs.slice().reverse().map(jobHtml).join("")
                        : `<div class="card empty">Nothing yet. Paste a link above.</div>`;
                    document.querySelectorAll(".song-list").forEach((l) => (l.scrollTop = scroll[l.dataset.id] ?? l.scrollHeight));
                } catch {
                    $("#jobs").innerHTML = `<div class="card empty">TubeGrabber isn't running. Start it with <code>sh run.sh</code>.</div>`;
                }
            }
            refresh();
            setInterval(refresh, 1000);
        </script>
    </body>
</html>
